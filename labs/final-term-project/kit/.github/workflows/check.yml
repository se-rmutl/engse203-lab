# CI — รัน test ทุกครั้งที่ push และเปิด Pull Request (Final Term Project)
# กลุ่ม 3 คน: ลบ # หน้าบรรทัด "npm run build" ด้านล่าง (ROLES.md ข้อ D8 · checker ข้อ X1 — บรรทัดที่ยังเป็นคอมเมนต์ไม่นับ)
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix api && npm install --prefix frontend
      - run: npm test
      # - run: npm run build
