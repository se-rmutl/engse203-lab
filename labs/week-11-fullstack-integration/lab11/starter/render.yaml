services:
  - type: web
    name: campus-service
    runtime: node
    plan: free
    region: singapore
    rootDir: labs/week-11/source
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"